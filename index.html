<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PIN IT</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>

<style>
  :root{
    --glow-red:255,70,95;
    --glow-gold:255,215,0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;width:100%;height:100%;
    font-family:'Poppins',sans-serif;
    overflow:hidden;
    user-select:none;
    background:
      radial-gradient(circle at 25% 15%, rgba(80,20,60,.35) 0%, transparent 45%),
      radial-gradient(circle at 80% 85%, rgba(20,30,80,.35) 0%, transparent 50%),
      linear-gradient(160deg,#0b0c1a 0%, #08080f 55%, #000000 100%);
    background-attachment:fixed;
  }
  #app{position:relative;width:100vw;height:100vh;}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;}
  .hidden{display:none !important;}

  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  @keyframes mapIn{from{opacity:0;transform:scale(.85);}to{opacity:1;transform:scale(1);}}
  @keyframes popIn{0%{opacity:0;transform:translateX(-50%) scale(.6) translateY(-10px);}60%{opacity:1;transform:translateX(-50%) scale(1.08);}100%{transform:translateX(-50%) scale(1);}}
  @keyframes dropIn{0%{transform:translateY(-30px) scale(.5);opacity:0;}60%{transform:translateY(3px) scale(1.1);opacity:1;}100%{transform:translateY(0) scale(1);}}
  @keyframes glowPulse{
    0%,100%{filter:drop-shadow(0 0 6px rgba(var(--glow-red),.55)) drop-shadow(0 0 20px rgba(var(--glow-red),.30));}
    50%{filter:drop-shadow(0 0 10px rgba(var(--glow-red),.75)) drop-shadow(0 0 32px rgba(var(--glow-red),.45));}
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .anim-fadeIn{animation:fadeIn .5s ease both;}
  .anim-mapIn{animation:mapIn .55s cubic-bezier(.2,.8,.3,1) both;}
  .anim-popIn{animation:popIn .4s cubic-bezier(.2,.8,.3,1) both;}
  .anim-dropIn{animation:dropIn .4s cubic-bezier(.2,.8,.3,1) both; transform-origin:bottom center;}

  .country-shape{
    fill:#b5484f;
    stroke:rgba(255,255,255,.18);
    stroke-width:.6;
    animation:glowPulse 3.4s ease-in-out infinite;
  }
  svg.country-svg{overflow:visible;}
  .pin{pointer-events:none;}
  .pin path{stroke-width:1.2;}
  .drag-pin{pointer-events:auto;cursor:grab;touch-action:none;}
  .drag-pin.dragging{cursor:grabbing;}
  .drag-pin path{fill:#ffffff;stroke:#1a1a1a;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5)) drop-shadow(0 0 10px rgba(255,255,255,.55));}
  .drag-pin circle{fill:#b5484f;}
  .drag-pin.dragging{transform:scale(1.2);transition:transform .12s ease;}
  .pin-capital path{fill:#ffd700;stroke:#5c4a00;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5)) drop-shadow(0 0 12px rgba(255,215,0,.7));}
  .pin-capital circle{fill:#7a1f1f;}
  .link-line{stroke:rgba(255,255,255,.55);stroke-width:2;stroke-dasharray:5 6;}

  .glass{
    background:rgba(255,255,255,.06);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,.12);
  }
  .btn-primary{
    background:linear-gradient(135deg,#ff5f7a 0%,#c22a4d 55%,#7a1f3a 100%);
    box-shadow:0 4px 24px rgba(255,60,100,.35), inset 0 1px 0 rgba(255,255,255,.25);
    transition:transform .15s ease, box-shadow .2s ease, filter .2s ease;
  }
  .btn-primary:hover{filter:brightness(1.12);box-shadow:0 6px 30px rgba(255,60,100,.5), inset 0 1px 0 rgba(255,255,255,.3);}
  .btn-primary:active{transform:scale(.94);}
  .btn-primary.disabled{
    background:linear-gradient(135deg,#3a2a30,#241a1e);
    box-shadow:none;color:#8a8a8a;pointer-events:none;filter:none;
  }
  .spinner{
    width:44px;height:44px;border-radius:9999px;
    border:3px solid rgba(255,255,255,.15);
    border-top-color:#ff5f7a;
    animation:spin .9s linear infinite;
  }
  .bar-fill{transition:width .6s cubic-bezier(.2,.8,.3,1);}
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:8px;}
</style>
</head>
<body class="text-white">
<div id="app">

  <!-- LOADING SCREEN -->
  <div class="screen" id="screen-loading">
    <div class="flex-1 flex flex-col items-center justify-center gap-5">
      <div class="spinner"></div>
      <div class="text-sm tracking-widest text-white/50">ЗАВАНТАЖЕННЯ КАРТ...</div>
    </div>
  </div>

  <!-- START SCREEN -->
  <div class="screen hidden" id="screen-start">
    <div class="flex-1 flex flex-col items-center justify-center text-center gap-6 px-6">
      <div class="anim-fadeIn text-5xl sm:text-7xl font-extrabold tracking-[.2em] flex items-center gap-4 bg-gradient-to-r from-pink-300 via-rose-400 to-red-500 bg-clip-text text-transparent drop-shadow-[0_0_25px_rgba(255,90,130,.35)]">
        PIN IT <span class="drop-shadow-none">🌸</span>
      </div>
      <div class="anim-fadeIn text-white/60 max-w-md text-sm sm:text-base tracking-wide" style="animation-delay:.1s">
        Перетягни маркер на карту столиці. Чим точніше — тим більше балів. 10 країн, 10 раундів.
      </div>
      <button id="btn-start" class="anim-fadeIn btn-primary text-white font-semibold tracking-[.25em] text-sm sm:text-base px-12 py-4 rounded-full" style="animation-delay:.2s">
        START GAME
      </button>
    </div>
  </div>

  <!-- ROUND SCREEN -->
  <div class="screen hidden" id="screen-round">
    <div class="glass rounded-2xl mx-4 mt-4 md:mx-8 md:mt-6 px-6 py-4 flex items-center justify-between shadow-lg anim-fadeIn">
      <div class="leading-6">
        <div id="round-label" class="text-sm md:text-base tracking-widest font-medium">ROUND 1/10</div>
        <div id="score-label" class="text-sm md:text-base tracking-widest text-white/70">SCORE 0</div>
      </div>
      <div class="text-sm md:text-lg tracking-widest font-semibold flex items-center gap-2">PIN IT <span>🌸</span></div>
    </div>

    <div id="feedback-label" class="hidden absolute left-1/2 top-4 md:top-6 -translate-x-1/2 font-extrabold tracking-wider text-2xl md:text-4xl bg-gradient-to-r from-yellow-200 via-yellow-400 to-amber-400 bg-clip-text text-transparent drop-shadow-[0_0_20px_rgba(255,215,0,.45)] z-10"></div>

    <div class="flex-1 flex items-center justify-center px-4 min-h-0 relative">
      <div id="map-box" class="w-[88vw] max-w-[560px] h-[54vh] max-h-[560px] flex items-center justify-center"></div>
    </div>

    <div class="px-5 md:px-8 pb-5 md:pb-6 flex items-end justify-between gap-4">
      <div id="question-box" class="glass rounded-xl px-4 py-3 max-w-[60%]">
        <div id="question-text" class="text-[11px] md:text-sm tracking-widest text-white/70"></div>
        <div id="distance-info" class="hidden text-[11px] md:text-sm tracking-wide text-white/70 leading-relaxed"></div>
      </div>
      <button id="btn-action" class="btn-primary text-white font-semibold tracking-[.2em] text-xs md:text-base px-8 md:px-10 py-3 md:py-4 rounded-full shrink-0">LOCK IN</button>
    </div>
  </div>

  <!-- FINAL SCREEN -->
  <div class="screen hidden" id="screen-final">
    <div class="px-6 pt-6 flex justify-end">
      <div class="text-sm md:text-lg tracking-widest font-semibold flex items-center gap-2">PIN IT <span>🌸</span></div>
    </div>
    <div class="flex-1 overflow-y-auto px-4 sm:px-8 pb-10">
      <div class="max-w-2xl mx-auto">
        <div class="text-center text-3xl md:text-5xl font-extrabold tracking-[.15em] my-6 bg-gradient-to-r from-white to-white/70 bg-clip-text text-transparent">YOUR ROUNDS</div>
        <div class="glass rounded-2xl p-5 md:p-7">
          <div id="rounds-list" class="flex flex-col gap-3"></div>
        </div>
        <div class="flex justify-center gap-10 md:gap-16 my-8">
          <div class="text-center">
            <div id="final-total" class="text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-amber-400">0</div>
            <div class="text-[11px] md:text-xs tracking-widest text-white/50 mt-1">TOTAL SCORE</div>
          </div>
          <div class="text-center">
            <div id="final-avg" class="text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-amber-400">0</div>
            <div class="text-[11px] md:text-xs tracking-widest text-white/50 mt-1">AVG / ROUND</div>
          </div>
        </div>
        <div class="flex justify-center pb-4">
          <button id="btn-again" class="btn-primary text-white font-semibold tracking-[.25em] text-sm md:text-base px-12 py-4 rounded-full">PLAY AGAIN</button>
        </div>
      </div>
    </div>
  </div>

</div>

const TOPO_URL="https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json";

/* =========================================================
   GEOMETRY HELPERS
   ========================================================= */
function ringExtent(ring){
  let minLon=Infinity,maxLon=-Infinity,minLat=Infinity,maxLat=-Infinity;
  for(const p of ring){ if(p[0]<minLon)minLon=p[0]; if(p[0]>maxLon)maxLon=p[0]; if(p[1]<minLat)minLat=p[1]; if(p[1]>maxLat)maxLat=p[1]; }
  return Math.max(maxLon-minLon, maxLat-minLat);
}
function simplifyRing(ring, maxPoints){
  if(ring.length<=maxPoints) return ring;
  const stride=Math.ceil(ring.length/maxPoints);
  const out=[];
  for(let i=0;i<ring.length;i+=stride) out.push(ring[i]);
  return out;
}
function ringCentroid(ring){
  let sx=0,sy=0;
  for(const p of ring){ sx+=p[0]; sy+=p[1]; }
  return [sx/ring.length, sy/ring.length];
}
function extractRingsFromGeometry(geometry){
  if(!geometry) return null;
  let polys;
  if(geometry.type==="Polygon") polys=[geometry.coordinates];
  else if(geometry.type==="MultiPolygon") polys=geometry.coordinates;
  else return null;
  let rings=polys.map(function(poly){ return poly[0]; }); // outer ring only
  if(!rings.length) return null;

  // drop tiny islets relative to the largest landmass
  let extents=rings.map(ringExtent);
  let maxExtent=Math.max.apply(null, extents);
  rings=rings.filter(function(r,i){ return extents[i] >= maxExtent*0.02; });
  if(!rings.length) return null;

  // drop remote overseas territories (e.g. French Guiana, Réunion) that would
  // otherwise blow out the bounding box and make the mainland render tiny.
  // Keep only landmasses geographically close to the largest one (the mainland).
  extents=rings.map(ringExtent);
  maxExtent=Math.max.apply(null, extents);
  const mainIdx=extents.indexOf(maxExtent);
  const mainCenter=ringCentroid(rings[mainIdx]);
  const reach=Math.max(maxExtent*3, 5); // degrees; generous enough for nearby islands (Corsica, Crete...)
  rings=rings.filter(function(r){
    const c=ringCentroid(r);
    const d=Math.hypot(c[0]-mainCenter[0], c[1]-mainCenter[1]);
    return d<=reach;
  });

  return rings.map(function(r){ return simplifyRing(r, 350); });
}

async function loadHighResBoundaries(){
  const res=await fetch(TOPO_URL);
  if(!res.ok) throw new Error("fetch failed");
  const topo=await res.json();
  const geo=topojson.feature(topo, topo.objects.countries);
  const byIso={};
  geo.features.forEach(function(f){ byIso[parseInt(f.id,10)]=f; });
  RAW_COUNTRIES.forEach(function(c){
    const f=byIso[c.iso];
    const rings=f?extractRingsFromGeometry(f.geometry):null;
    c.rings = rings && rings.length ? rings : c.fallbackRings;
  });
}

function buildProjection(rings, targetMax, padRatio){
  let minLon=Infinity,maxLon=-Infinity,minLat=Infinity,maxLat=-Infinity;
  rings.forEach(function(ring){ ring.forEach(function(p){
    const lon=p[0], lat=p[1];
    if(lon<minLon)minLon=lon; if(lon>maxLon)maxLon=lon;
    if(lat<minLat)minLat=lat; if(lat>maxLat)maxLat=lat;
  }); });
  const midLat=(minLat+maxLat)/2;
  const cos=Math.cos(midLat*Math.PI/180);
  const rawW=(maxLon-minLon)*cos;
  const rawH=(maxLat-minLat);
  const pad=Math.max(rawW,rawH)*padRatio;
  const w=rawW+2*pad, h=rawH+2*pad;
  const scale=targetMax/Math.max(w,h);
  return {
    svgW:w*scale, svgH:h*scale,
    project:function(lon,lat){
      const xRaw=(lon-minLon)*cos+pad;
      const yRaw=(maxLat-lat)+pad;
      return [xRaw*scale, yRaw*scale];
    },
    unproject:function(x,y){
      const xRaw=x/scale-pad;
      const yRaw=y/scale-pad;
      return [xRaw/cos+minLon, maxLat-yRaw];
    }
  };
}

function smoothRingPath(ringXY){
  const n=ringXY.length;
  if(n<3) return "";
  const pt=function(i){ return ringXY[(i+n)%n]; };
  const mid=function(a,b){ return [(a[0]+b[0])/2, (a[1]+b[1])/2]; };
  const start=mid(pt(n-1), pt(0));
  let d="M"+start[0].toFixed(2)+","+start[1].toFixed(2);
  for(let i=0;i<n;i++){
    const cur=pt(i), nxt=pt(i+1), m=mid(cur,nxt);
    d+=" Q"+cur[0].toFixed(2)+","+cur[1].toFixed(2)+" "+m[0].toFixed(2)+","+m[1].toFixed(2);
  }
  return d+" Z";
}

function pointInRingXY(x,y,ringXY){
  let inside=false;
  for(let i=0,j=ringXY.length-1;i<ringXY.length;j=i++){
    const xi=ringXY[i][0], yi=ringXY[i][1];
    const xj=ringXY[j][0], yj=ringXY[j][1];
    const intersect=((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi);
    if(intersect) inside=!inside;
  }
  return inside;
}

function haversineKm(lat1,lon1,lat2,lon2){
  const R=6371;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function calcScore(distanceKm, countrySizeKm, insideCountry){
  if(!insideCountry) return 0;
  const pct=(distanceKm/countrySizeKm)*100;
  let score;
  if(pct<=5) score=100;
  else if(pct<=50) score=100-(pct-5)*(50/45);
  else if(pct<=100){ const t=(pct-50)/50; score=50*(1-t)*(1-t); }
  else score=0;
  return Math.max(0, Math.min(100, Math.round(score)));
}

function feedbackLabel(score){
  if(score>=90) return "PERFECT";
  if(score>=60) return "NICE";
  if(score>=30) return "CLOSE";
  return "MISS";
}

function pinSVG(cls){
  return '<g class="pin '+cls+'">'+
    '<path d="M0,0 C-9,-13 -15,-21 -15,-30 C-15,-43 -8,-52 0,-52 C8,-52 15,-43 15,-30 C15,-21 9,-13 0,0 Z"></path>'+
    '<circle cx="0" cy="-31" r="7"></circle>'+
    '</g>';
}

/* =========================================================
   GAME STATE
   ========================================================= */
const state={ order:[], round:0, score:0, roundScores:[], country:null, proj:null, ringsXY:null, locked:false, pinTarget:null };

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}

const screenLoading=document.getElementById('screen-loading');
const screenStart=document.getElementById('screen-start');
const screenRound=document.getElementById('screen-round');
const screenFinal=document.getElementById('screen-final');
const roundLabel=document.getElementById('round-label');
const scoreLabel=document.getElementById('score-label');
const mapBox=document.getElementById('map-box');
const questionText=document.getElementById('question-text');
const distanceInfo=document.getElementById('distance-info');
const feedbackLabelEl=document.getElementById('feedback-label');
const btnAction=document.getElementById('btn-action');

document.getElementById('btn-start').addEventListener('click', startGame);
document.getElementById('btn-again').addEventListener('click', startGame);
btnAction.addEventListener('click', onActionClick);

(async function init(){
  try{ await loadHighResBoundaries(); }
  catch(e){
    console.warn("High-res boundary fetch failed, using fallback data.", e);
    RAW_COUNTRIES.forEach(function(c){ c.rings=c.fallbackRings; });
  }
  screenLoading.classList.add('hidden');
  screenStart.classList.remove('hidden');
})();

function startGame(){
  state.order=shuffle(RAW_COUNTRIES);
  state.round=0; state.score=0; state.roundScores=[];
  screenStart.classList.add('hidden');
  screenFinal.classList.add('hidden');
  screenRound.classList.remove('hidden');
  loadRound();
}

function loadRound(){
  state.locked=false;
  const country=state.order[state.round];
  state.country=country;

  const proj=buildProjection(country.rings, 600, 0.09);
  state.proj=proj;
  state.ringsXY=country.rings.map(function(ring){ return ring.map(function(p){ return proj.project(p[0],p[1]); }); });

  roundLabel.textContent="ROUND "+(state.round+1)+"/10";
  scoreLabel.textContent="SCORE "+state.score;
  questionText.textContent="ЗНАЙДИ ДЕ СТОЛИЦЯ "+country.name.toUpperCase()+"!";
  questionText.classList.remove('hidden');
  distanceInfo.classList.add('hidden');
  feedbackLabelEl.classList.add('hidden');
  feedbackLabelEl.textContent="";
  btnAction.textContent="LOCK IN";
  btnAction.classList.remove('disabled');

  const pathD=state.ringsXY.map(smoothRingPath).join(' ');
  const startX=proj.svgW/2, startY=proj.svgH/2;

  mapBox.innerHTML=
    '<svg class="country-svg anim-mapIn" id="country-svg" viewBox="0 0 '+proj.svgW.toFixed(2)+' '+proj.svgH.toFixed(2)+'" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%;">'+
      '<path class="country-shape" d="'+pathD+'"></path>'+
      '<g id="pins-layer"></g>'+
      '<g id="drag-pin-pos" transform="translate('+startX.toFixed(2)+','+startY.toFixed(2)+')">'+
        '<g id="drag-pin" class="pin drag-pin anim-dropIn">'+
          '<circle class="pin-hitarea" cx="0" cy="-26" r="34" style="fill:transparent;" pointer-events="all"></circle>'+
          '<path d="M0,0 C-9,-13 -15,-21 -15,-30 C-15,-43 -8,-52 0,-52 C8,-52 15,-43 15,-30 C15,-21 9,-13 0,0 Z"></path>'+
          '<circle cx="0" cy="-31" r="7"></circle>'+
        '</g>'+
      '</g>'+
    '</svg>';

  setupDragPin(document.getElementById('country-svg'), [startX,startY]);
}

function setupDragPin(svg, startXY){
  const pinPos=document.getElementById('drag-pin-pos');
  const pinEl=document.getElementById('drag-pin');
  let dragging=false;
  state.pinTarget=startXY.slice();

  // Convert a raw screen point (clientX/clientY) into the SVG's internal
  // viewBox coordinate space. This accounts for the SVG's viewBox scale,
  // preserveAspectRatio letterboxing and any CSS sizing in one step, so it
  // stays exact no matter how the map is scaled/resized (more reliable than
  // hand-rolling the math from getBoundingClientRect()).
  function toSvgPoint(clientX, clientY){
    const pt=svg.createSVGPoint();
    pt.x=clientX; pt.y=clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }
  function setPos(x,y){
    state.pinTarget=[x,y];
    pinPos.setAttribute('transform','translate('+x.toFixed(2)+','+y.toFixed(2)+')');
  }
  function startDrag(clientX, clientY){
    if(state.locked) return;
    dragging=true;
    pinEl.classList.add('dragging');
    const p=toSvgPoint(clientX, clientY);
    setPos(p.x, p.y);
  }
  function moveDrag(clientX, clientY){
    if(!dragging) return;
    const p=toSvgPoint(clientX, clientY);
    setPos(p.x, p.y);
  }
  function endDrag(){
    if(!dragging) return;
    dragging=false;
    pinEl.classList.remove('dragging');
  }

  // Mouse: listeners for move/up are attached to window only while a drag is
  // active, so fast cursor movement never "loses" the pin outside the pin's
  // own hit area.
  function onMouseDown(e){
    if(e.button !== 0) return; // left mouse button only
    e.preventDefault();
    startDrag(e.clientX, e.clientY);
    window.addEventListener('mousemove', onMouseMove);
    window.addEventListener('mouseup', onMouseUp);
  }
  function onMouseMove(e){
    if(!dragging) return;
    if((e.buttons & 1)===0){ onMouseUp(e); return; } // left button released outside the window
    e.preventDefault();
    moveDrag(e.clientX, e.clientY);
  }
  function onMouseUp(e){
    if(e.button!==undefined && e.button!==0) return;
    endDrag();
    window.removeEventListener('mousemove', onMouseMove);
    window.removeEventListener('mouseup', onMouseUp);
  }

  // Touch: same pattern, listening on window while a touch-drag is active.
  function onTouchStart(e){
    if(state.locked) return;
    e.preventDefault();
    const t=e.touches[0];
    startDrag(t.clientX, t.clientY);
    window.addEventListener('touchmove', onTouchMove, {passive:false});
    window.addEventListener('touchend', onTouchEnd);
    window.addEventListener('touchcancel', onTouchEnd);
  }
  function onTouchMove(e){
    if(!dragging) return;
    e.preventDefault();
    const t=e.touches[0];
    moveDrag(t.clientX, t.clientY);
  }
  function onTouchEnd(){
    endDrag();
    window.removeEventListener('touchmove', onTouchMove);
    window.removeEventListener('touchend', onTouchEnd);
    window.removeEventListener('touchcancel', onTouchEnd);
  }

  pinEl.addEventListener('mousedown', onMouseDown);
  pinEl.addEventListener('touchstart', onTouchStart, {passive:false});
  pinEl.addEventListener('dragstart', function(e){ e.preventDefault(); });
  pinEl.addEventListener('contextmenu', function(e){ e.preventDefault(); });
}

function onActionClick(){
  if(btnAction.classList.contains('disabled')) return;
  if(!state.locked) lockIn();
  else nextRound();
}

function lockIn(){
  state.locked=true;
  const svg=document.getElementById('country-svg');
  const pinEl=document.getElementById('drag-pin');
  pinEl.style.pointerEvents='none';

  const country=state.country;
  const proj=state.proj;
  const pinXY=state.pinTarget;

  const lonLat=proj.unproject(pinXY[0], pinXY[1]);
  const inside=state.ringsXY.some(function(ringXY){ return pointInRingXY(pinXY[0], pinXY[1], ringXY); });
  const distanceKm=haversineKm(lonLat[1], lonLat[0], country.lat, country.lng);
  const score=calcScore(distanceKm, country.countrySizeKm, inside);

  state.roundScores.push(score);
  state.score+=score;

  const capXY=proj.project(country.lng, country.lat);
  const pinsLayer=document.getElementById('pins-layer');

  const line=document.createElementNS('http://www.w3.org/2000/svg','line');
  line.setAttribute('class','link-line');
  line.setAttribute('x1', pinXY[0].toFixed(2));
  line.setAttribute('y1', pinXY[1].toFixed(2));
  line.setAttribute('x2', capXY[0].toFixed(2));
  line.setAttribute('y2', capXY[1].toFixed(2));
  pinsLayer.appendChild(line);

  const capWrap=document.createElementNS('http://www.w3.org/2000/svg','g');
  capWrap.setAttribute('transform','translate('+capXY[0].toFixed(2)+','+capXY[1].toFixed(2)+')');
  capWrap.innerHTML=pinSVG('pin-capital anim-dropIn');
  pinsLayer.appendChild(capWrap);

  scoreLabel.textContent="SCORE "+state.score;
  feedbackLabelEl.textContent=feedbackLabel(score)+"  +"+score;
  feedbackLabelEl.classList.remove('hidden');
  feedbackLabelEl.classList.add('anim-popIn');

  questionText.classList.add('hidden');
  distanceInfo.classList.remove('hidden');
  distanceInfo.innerHTML="Правильна відповідь: "+country.capital+"<br>Похибка: "+Math.round(distanceKm)+" км";

  btnAction.textContent=(state.round<9)?"NEXT ROUND":"SEE RESULTS";
}

function nextRound(){
  state.round++;
  if(state.round>=10) showFinal();
  else loadRound();
}

function showFinal(){
  screenRound.classList.add('hidden');
  screenFinal.classList.remove('hidden');

  const list=document.getElementById('rounds-list');
  list.innerHTML='';
  state.roundScores.forEach(function(s,i){
    const row=document.createElement('div');
    row.className='flex items-center gap-4 text-xs md:text-sm tracking-wide';
    row.innerHTML=
      '<div class="w-20 shrink-0 text-white/60">ROUND '+(i+1)+'</div>'+
      '<div class="flex-1 h-3.5 rounded-full bg-white/10 overflow-hidden border border-white/10">'+
        '<div class="bar-fill h-full rounded-full bg-gradient-to-r from-rose-600 to-amber-400" style="width:'+s+'%"></div>'+
      '</div>'+
      '<div class="w-10 text-right font-semibold text-amber-300">'+s+'</div>';
    list.appendChild(row);
  });

  const total=state.roundScores.reduce(function(a,b){return a+b;},0);
  const avg=Math.round(total/state.roundScores.length);
  document.getElementById('final-total').textContent=total;
  document.getElementById('final-avg').textContent=avg;
}

})();
</script>
